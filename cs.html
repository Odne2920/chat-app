<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Clear Storage</title>
</head>
<body>
<script>
window.addEventListener("load", async () => {
    try {
        // LocalStorage
        localStorage.clear();

        // SessionStorage
        sessionStorage.clear();

        // IndexedDB
        if (window.indexedDB && indexedDB.databases) {
            const dbs = await indexedDB.databases();
            for (const db of dbs) {
                indexedDB.deleteDatabase(db.name);
            }
        }

        // Cache Storage (Service Worker cache)
        if ('caches' in window) {
            const keys = await caches.keys();
            for (const key of keys) {
                await caches.delete(key);
            }
        }

        console.log("Alle storage van deze origin is gewist.");
    } catch (e) {
        console.error("Fout bij wissen:", e);
    }
});
</script>
</body>
</html>
